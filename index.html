<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#002347">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cobalt CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#f6f8fb; --surface:#ffffff; --surface-sunk:#eef1f6;
    --ink:#0f1e33; --ink-soft:#33475f; --ink-faint:#64748b; --line:#e2e8f0;
    --cobalt:#0047AB; --cobalt-dark:#002347; --cobalt-mid:#1a4b8c; --cobalt-light:#4a7fc4; --cobalt-tint:#e7edf9;
    --amber:#9a6a12; --amber-tint:#fbf0dd;
    --green:#0f7a4a; --green-tint:#e3f2ea;
    --red:#b3261e; --red-tint:#f8e9e7;
    --grey-tint:#eef1f4;
    --radius:8px;
    --shadow:0 1px 2px rgba(15,30,51,0.04), 0 8px 24px -12px rgba(15,30,51,0.14);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif; font-variant-numeric:tabular-nums; }
  .display{ font-family:'Sora',sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .wrap{ max-width:1360px; margin:0 auto; padding:28px 28px 80px; }

  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:18px; flex-wrap:wrap; }
  .brand{ display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
  .brand-mark svg{ height:40px; width:auto; display:block; }
  .brand h1{ font-size:20px; margin:0; font-weight:600; letter-spacing:-0.01em; }
  .brand p{ margin:1px 0 0; font-size:12.5px; color:var(--ink-soft); }
  .actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  button{ font-family:inherit; cursor:pointer; }
  .btn{ border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:8px 14px; border-radius:6px;
    font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:border-color .15s, background .15s; text-decoration:none; }
  .btn:hover{ border-color:var(--cobalt); background:var(--cobalt-tint); }
  .btn-primary{ background:var(--cobalt); border-color:var(--cobalt); color:#fff; }
  .btn-primary:hover{ background:var(--cobalt-dark); border-color:var(--cobalt-dark); }
  .btn-ghost{ color:var(--ink-soft); }
  .btn-danger{ color:var(--red); border-color:var(--red-tint); background:var(--red-tint); }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto; }
  .tab{ background:none; border:none; padding:10px 16px; font-size:13px; font-weight:600; color:var(--ink-soft); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
  .tab.active{ color:var(--cobalt); border-bottom-color:var(--cobalt); }
  .tab .ct{ font-family:'IBM Plex Mono',monospace; font-size:11px; background:var(--surface-sunk); padding:1px 6px; border-radius:10px; margin-left:6px; color:var(--ink-soft); }
  .tab.active .ct{ background:var(--cobalt-tint); color:var(--cobalt-dark); }

  .summary{ display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--line); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; margin-bottom:18px; }
  .summary .cell{ background:var(--surface); padding:14px 16px; }
  .summary .num{ font-family:'Sora',sans-serif; font-size:22px; font-weight:600; line-height:1; }
  .summary .lbl{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:6px; text-transform:uppercase; letter-spacing:.08em; }
  .num.warn{ color:var(--amber); } .num.bad{ color:var(--red); } .num.accent{ color:var(--cobalt); }

  .filterbar{ display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .filterbar select, .filterbar input[type=text]{ padding:8px 11px; border:1px solid var(--line); border-radius:8px; font-size:13px; font-family:inherit; background:var(--surface); color:var(--ink); }
  .filterbar input[type=text]{ min-width:240px; }
  .spacer{ flex:1; }
  .count-pill{ font-size:12px; color:var(--ink-soft); }

  .tablewrap{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto; box-shadow:var(--shadow); }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{ text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft);
    padding:11px 12px; background:var(--surface-sunk); border-bottom:1px solid var(--line); font-weight:600; white-space:nowrap; cursor:pointer; user-select:none; }
  thead th.sorted{ color:var(--cobalt); }
  tbody tr{ border-bottom:1px solid var(--line); }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:#FAFBFC; }
  td{ padding:9px 12px; vertical-align:middle; }
  .linkish{ font-weight:600; color:var(--ink); cursor:pointer; }
  .linkish:hover{ color:var(--cobalt); text-decoration:underline; }
  .sub{ font-size:11.5px; color:var(--ink-faint); }
  .overdue{ color:var(--red); font-weight:600; }
  .due{ color:var(--amber); font-weight:600; }
  input.touch-date{ font-size:12px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font-family:inherit; width:124px; background:var(--surface); }

  .pill{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap; background:var(--grey-tint); color:var(--ink-soft); }
  .pill.role{ background:var(--cobalt-tint); color:var(--cobalt-dark); }
  .pill.flag{ background:var(--red-tint); color:var(--red); }
  .s-Prospect{ background:var(--grey-tint); color:var(--ink-soft); }
  .s-Working{ background:var(--amber-tint); color:var(--amber); }
  .s-Qualified{ background:var(--cobalt-tint); color:var(--cobalt-dark); }
  .s-Client{ background:var(--green-tint); color:var(--green); }
  .s-Partner{ background:#e8e4f6; color:#4b3a8f; }
  .s-Nurture{ background:#e6f2f5; color:#1c5f6e; }
  .s-Dead, .s-DoNotContact{ background:var(--red-tint); color:var(--red); }

  .queue-group{ margin-bottom:22px; }
  .queue-group h3{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft); margin:0 0 8px; font-weight:600; }
  .queue-item{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; display:flex; gap:14px; align-items:center; box-shadow:var(--shadow); }
  .queue-item .main{ flex:1; min-width:0; }
  .queue-item .why{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .queue-item .when{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; white-space:nowrap; }
  .queue-item .acts{ display:flex; gap:6px; flex-shrink:0; }
  .kind{ font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--cobalt); margin-right:6px; }

  .empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius); }
  .empty .display{ font-size:19px; color:var(--ink); margin-bottom:8px; }
  .empty p{ max-width:440px; margin:0 auto 16px; font-size:13.5px; line-height:1.5; }

  .overlay{ position:fixed; inset:0; background:rgba(15,30,51,0.45); display:flex; align-items:flex-start; justify-content:center; z-index:50; padding:40px 24px; overflow-y:auto; }
  .modal{ background:var(--surface); border-radius:14px; width:100%; max-width:560px; box-shadow:0 24px 60px -20px rgba(0,0,0,0.35); }
  .modal.wide{ max-width:980px; }
  .modal-head{ padding:20px 24px 6px; display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
  .modal-head h2{ font-size:19px; margin:0 0 4px; }
  .modal-head p{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  .modal-body{ padding:12px 24px 18px; }
  .modal-foot{ display:flex; justify-content:space-between; align-items:center; padding:14px 24px 22px; gap:10px; border-top:1px solid var(--line); }
  .x{ background:none; border:none; font-size:22px; color:var(--ink-faint); line-height:1; padding:2px 6px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px 14px; }
  .fb label{ display:block; font-size:11.5px; font-weight:600; margin-bottom:4px; color:var(--ink-soft); }
  .fb input, .fb select, .fb textarea{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; font-family:inherit; background:var(--surface); color:var(--ink); }
  .fb textarea{ min-height:64px; resize:vertical; }
  .section-title{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft); margin:20px 0 8px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  .checks{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; }
  .checks label{ display:flex; gap:5px; align-items:center; font-weight:500; color:var(--ink); }

  .detail-cols{ display:grid; grid-template-columns:1.05fr 1fr; gap:24px; }
  .banner{ border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; }
  .banner.red{ background:var(--red-tint); color:var(--red); }
  .banner.amber{ background:var(--amber-tint); color:var(--amber); }
  .card{ border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:12.5px; background:var(--surface); }
  .card .row{ display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .card .meta{ font-size:11px; color:var(--ink-faint); }
  .timeline{ max-height:420px; overflow-y:auto; padding-right:4px; }
  .tl{ border-left:2px solid var(--line); padding:0 0 12px 12px; position:relative; font-size:12.5px; }
  .tl:before{ content:''; position:absolute; left:-5px; top:4px; width:8px; height:8px; border-radius:50%; background:var(--cobalt-light); }
  .tl.task:before{ background:var(--amber); }
  .tl .meta{ font-size:11px; color:var(--ink-faint); margin-bottom:2px; }
  .tl .body{ white-space:pre-wrap; }
  .logbox{ background:var(--surface-sunk); border-radius:10px; padding:12px; }
  .logbox .typebar{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
  .typebtn{ border:1px solid var(--line); background:var(--surface); border-radius:16px; padding:4px 10px; font-size:11.5px; font-weight:600; color:var(--ink-soft); }
  .typebtn.on{ background:var(--cobalt); border-color:var(--cobalt); color:#fff; }
  .quickdates{ display:flex; gap:5px; flex-wrap:wrap; margin-top:4px; }
  .quickdates button{ border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:3px 8px; font-size:11px; color:var(--ink-soft); }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12.5px; }
  .kv dt{ color:var(--ink-faint); } .kv dd{ margin:0; }

  .dropdown{ position:relative; }
  .dd-list{ position:absolute; top:100%; left:0; right:0; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); z-index:20; max-height:240px; overflow-y:auto; }
  .dd-list div{ padding:8px 10px; font-size:12.5px; cursor:pointer; border-bottom:1px solid var(--line); }
  .dd-list div:hover{ background:var(--surface-sunk); }

  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:12.5px; z-index:200; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; }
  .toast.show{ opacity:1; }

  .authgate{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:500; padding:24px; }
  .authcard{ background:var(--surface); border:1px solid var(--line); border-radius:14px; width:100%; max-width:380px; padding:28px; box-shadow:var(--shadow); }
  .authcard h1{ font-size:20px; margin:0 0 3px; }
  .authcard p.sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; }
  .authcard label{ display:block; font-size:12px; font-weight:600; margin:12px 0 5px; }
  .authcard input{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; font-family:inherit; }
  .authcard .btn-primary{ width:100%; justify-content:center; margin-top:18px; padding:10px; }
  .authcard .err{ font-size:12.5px; color:var(--red); margin-top:10px; display:none; }
  .authcard .err.show{ display:block; }
  #csvInput{ display:none; }
  ::selection{ background:var(--cobalt-tint); }

  @media (max-width:860px){
    .wrap{ padding:16px 16px 60px; }
    .summary{ grid-template-columns:repeat(3,1fr); }
    .detail-cols, .grid2, .grid3{ grid-template-columns:1fr; }
    .overlay{ padding:0; }
    .modal, .modal.wide{ border-radius:0; min-height:100vh; }
    .queue-item{ flex-wrap:wrap; }
    .filterbar input[type=text]{ min-width:0; flex:1; }
    .hide-sm{ display:none; }
  }
</style>
</head>
<body>

<div class="authgate" id="authGate">
  <div class="authcard">
    <h1 class="display">Sign in</h1>
    <p class="sub">Cobalt CRM. For the team only.</p>
    <label for="authEmail">Email</label>
    <input type="email" id="authEmail" autocomplete="username">
    <label for="authPassword">Password</label>
    <input type="password" id="authPassword" autocomplete="current-password">
    <button class="btn btn-primary" id="authSubmit">Sign in</button>
    <div class="err" id="authErr"></div>
  </div>
</div>

<div class="wrap" id="mainApp" style="display:none;">
  <div class="topbar">
    <div class="brand">

  function fmtDate(s){ if(!s) return ''; var p=String(s).slice(0,10).split('-'); if(p.length<3) return s; return Number(p[1])+'/'+Number(p[2])+'/'+p[0].slice(2); }
  function fmtWhen(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
  function fmtMoney(n){ if(n==null||n===''||isNaN(n)) return ''; n=Number(n); if(Math.abs(n)>=1e6) return '$'+(n/1e6).toFixed(n>=1e7?0:1)+'M'; if(Math.abs(n)>=1e3) return '$'+Math.round(n/1e3)+'K'; return '$'+Math.round(n); }
  function parseMoney(v){ if(v==null) return null; var s=String(v).trim().toLowerCase().replace(/[$,\s]/g,''); if(!s) return null; var m=1; if(/m$/.test(s)){ m=1e6; s=s.slice(0,-1); } else if(/k$/.test(s)){ m=1e3; s=s.slice(0,-1); } var n=parseFloat(s); return isNaN(n)?null:n*m; }
  function normName(s){ return (s||'').toLowerCase().replace(/\b(inc|llc|ltd|corp|corporation|co|company|the)\b/g,'').replace(/[^a-z0-9]/g,''); }
  function normEmail(s){ s=(s||'').trim().toLowerCase(); return /@/.test(s)?s:''; }
  function normPhone(s){ var d=(s||'').replace(/\D/g,''); if(d.length===11&&d[0]==='1') d=d.slice(1); return d.length>=10?d:''; }
  function fullName(c){ return ((c.first_name||'')+' '+(c.last_name||'')).trim(); }
  function me(){ var e=(state.session&&state.session.email)||''; var l=e.split('@')[0].toLowerCase(); for(var i=0;i<OWNERS.length;i++){ if(l.indexOf(OWNERS[i].toLowerCase())===0) return OWNERS[i]; } return ''; }
  function who(){ return (state.session&&state.session.email)||'Unknown'; }
  function opts(list, sel, blank){ return (blank!=null?'<option value="">'+esc(blank)+'</option>':'')+list.map(function(o){ var v=typeof o==='object'?o.v:o, l=typeof o==='object'?o.l:o; return '<option value="'+esc(v)+'"'+(String(v)===String(sel||'')?' selected':'')+'>'+esc(l)+'</option>'; }).join(''); }
  function statusPill(s){ return '<span class="pill s-'+esc((s||'').replace(/\s/g,''))+'">'+esc(s)+'</span>'; }
  function touchClass(d){ if(!d) return ''; var t=today(); return d<t?'overdue':(d===t?'due':''); }
  function company(id){ for(var i=0;i<state.companies.length;i++) if(state.companies[i].id===id) return state.companies[i]; return null; }
  function contact(id){ for(var i=0;i<state.contacts.length;i++) if(state.contacts[i].id===id) return state.contacts[i]; return null; }
  function contactsOf(cid){ return state.contacts.filter(function(c){ return c.company_id===cid; }).sort(function(a,b){ return (b.is_primary?1:0)-(a.is_primary?1:0); }); }
  function primaryOf(cid){ return contactsOf(cid)[0]||null; }
  function dealsOf(cid){ return state.deals.filter(function(d){ return d.crm_company_id===cid; }); }
  function campaign(id){ for(var i=0;i<state.campaigns.length;i++) if(state.campaigns[i].id===id) return state.campaigns[i]; return null; }
  function hasRole(c, r){ return (c.roles||[]).indexOf(r)>=0; }
  var COI_ROLES = ['COI','CPA','Attorney','Wealth advisor','Lender'];
  function isReferralSource(c){ return (c.roles||[]).some(function(r){ return COI_ROLES.indexOf(r)>=0; }); }
  function coiControl(c){
    if(c.referral_partner_id) return '<span class="pill s-Partner" title="In the Referral Partner Tracker">COI in tracker</span>';
    if(isReferralSource(c)) return '<button class="btn btn-sm" data-makecoi="'+esc(c.id)+'" title="Add to the Referral Partner Tracker">Make COI</button>';
    return '';
  }
  function blocked(co){ return co && (co.do_not_contact || co.conflict_flag || co.status==='Do Not Contact'); }

  // ---------- auth (shared cobalt_session SSO) ----------
  function sbHeaders(extra){ var h={ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' }; if(state.session&&state.session.access_token) h['Authorization']='Bearer '+state.session.access_token; return Object.assign(h, extra||{}); }
  async function authCall(grant, body){
    var res = await fetch(AUTH+'/token?grant_type='+grant, { method:'POST', headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
    var data = await res.json(); if(!res.ok) throw new Error(data.error_description||data.msg||'Sign in failed'); return data;
  }
  function saveSession(d){ state.session={ access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+(d.expires_in||3600)*1000, email:d.user&&d.user.email }; try{ localStorage.setItem('cobalt_session', JSON.stringify(state.session)); }catch(e){} }
  function loadSession(){ try{ var r=localStorage.getItem('cobalt_session'); if(r) state.session=JSON.parse(r); }catch(e){ state.session=null; } }
  function clearSession(){ state.session=null; try{ localStorage.removeItem('cobalt_session'); }catch(e){} }
  async function ensureSession(){
    if(!state.session) return false;
    if(Date.now() < state.session.expires_at-60000) return true;
    try{ var em=state.session.email; saveSession(await authCall('refresh_token', { refresh_token:state.session.refresh_token })); if(!state.session.email) state.session.email=em; return true; }
    catch(e){ clearSession(); return false; }
  }

  // ---------- data access ----------
  async function api(method, path, body, prefer){
    await ensureSession();
    var res = await fetch(REST+path, { method:method, headers:sbHeaders(prefer?{ 'Prefer':prefer }:{}), body: body?JSON.stringify(body):undefined });
    if(res.status===401){ clearSession(); showAuth(); throw new Error('Session expired'); }
    if(!res.ok){ var t=''; try{ t=await res.text(); }catch(e){} throw new Error(method+' '+path.split('?')[0]+' failed '+res.status+' '+t.slice(0,160)); }
    if(res.status===204) return null;
    var txt = await res.text(); return txt?JSON.parse(txt):null;
  }
  function get(path){ return api('GET', path); }
  function insert(table, rows){ return api('POST', '/'+table, rows, 'return=minimal'); }
  function patch(table, id, fields){ return api('PATCH', '/'+table+'?id=eq.'+encodeURIComponent(id), fields, 'return=minimal'); }
  function del(table, id){ return api('DELETE', '/'+table+'?id=eq.'+encodeURIComponent(id), null, 'return=minimal'); }

  async function loadAll(){
    var since = new Date(Date.now()-120*864e5).toISOString();
    var r = await Promise.all([
      get('/crm_companies?select=*&order=name.asc'),
      get('/crm_contacts?select=*'),
      get('/crm_activities?select=*&or=(created_at.gte.'+since+',completed.eq.false)&order=created_at.desc'),
      get('/crm_campaigns?select=*&order=created_at.desc'),
      get('/debt_deals?select=id,company_name,stage,instrument_type,estimated_amount,actual_commission,funded_date,crm_company_id,crm_contact_id,referral_partner_id,assigned_to,updated_at'),
      get('/cre_deals?select=id,company_name,stage,deal_type,requested_amount,crm_company_id,crm_contact_id,referral_partner_id,assigned_to,updated_at'),
      get('/slb_deals?select=id,company_name,stage,estimated_amount,actual_commission,funded_date,crm_company_id,crm_contact_id,referral_partner_id,assigned_to,updated_at'),
      get('/referral_partners?select=id,partner_name,partner_type,status,crm_contact_id,crm_company_id')
    ]);
    state.companies=r[0]||[]; state.contacts=r[1]||[]; state.activities=r[2]||[]; state.campaigns=r[3]||[];
    state.deals = (r[4]||[]).map(function(d){ d.table='debt_deals'; d.pipe='Credit'; d.amount=d.estimated_amount; return d; })
      .concat((r[5]||[]).map(function(d){ d.table='cre_deals'; d.pipe='CRE'; d.amount=d.requested_amount; d.instrument_type=CRE_TYPES[d.deal_type]||'CRE'; return d; }))
      .concat((r[6]||[]).map(function(d){ d.table='slb_deals'; d.pipe='SLB'; d.amount=d.estimated_amount; d.instrument_type='SLB'; return d; }));
    state.partners=r[7]||[];
  }
  function dealOpen(d){ return ['Dead','Funded','SLB Dead','SLB Closed'].indexOf(d.stage)<0; }
  function dealLink(d){
    if(d.table==='cre_deals') return TOOL+'cobalt-cre-loan-calc/?load_deal_id='+encodeURIComponent(d.id);
    return TOOL+'cobalt-debt-deals/';
  }

  // ---------- today queue ----------
  function queueItems(){
    var t=today(), wk=addDays(7), items=[], own=state.filters.owner;
    state.companies.forEach(function(co){
      if(CLOSED[co.status]||co.do_not_contact||!co.next_touch_date||co.next_touch_date>wk) return;
      if(own && co.owner!==own) return;
      var p=primaryOf(co.id);
      items.push({ kind:'Follow up', date:co.next_touch_date, company:co, title:co.name, why:(p?fullName(p)+(p.title?', '+p.title:'')+' · ':'')+(co.status==='Nurture'&&co.nurture_reason?'Nurture: '+co.nurture_reason:statusOfLine(co)) });
    });
    state.contacts.forEach(function(c){
      if(c.do_not_contact||!c.next_touch_date||c.next_touch_date>wk) return;
      var co=company(c.company_id); if(co && (CLOSED[co.status]||co.do_not_contact)) return;
      if(own && (c.owner||(co&&co.owner))!==own) return;
      if(co && co.next_touch_date===c.next_touch_date) return;
      items.push({ kind:hasRole(c,'COI')?'COI touch':'Contact', date:c.next_touch_date, company:co, contact:c, title:fullName(c)+(co?' · '+co.name:''), why:(c.roles||[]).join(', ') });
    });
    state.activities.forEach(function(a){
      if(a.completed||!a.due_date||a.due_date>wk) return;
      if(own && a.owner!==own) return;
      var co=company(a.company_id);
      items.push({ kind:'Task', date:a.due_date, company:co, task:a, title:a.subject||a.body||'Task', why:co?co.name:'' });
    });
    // Dead deals whose company was never moved to Nurture: the recycle check
    state.deals.forEach(function(d){
      if((d.stage==='Dead'||d.stage==='SLB Dead') && d.crm_company_id){
        var co=company(d.crm_company_id);
        if(co && ['Nurture','Dead','Do Not Contact','Client','Partner'].indexOf(co.status)<0 && !dealsOf(co.id).some(dealOpen)){
          if(own && co.owner!==own) return;
          items.push({ kind:'Recycle', date:t, company:co, title:co.name, why:'Deal marked Dead in pipeline. Move to Nurture with a reason and a re-touch date, or close it out.' });
        }
      }
    });
    items.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
    return items;
  }
  function statusOfLine(co){ var n=dealsOf(co.id).filter(dealOpen).length; return co.status+(n?' · '+n+' open deal'+(n>1?'s':''):''); }

  function renderToday(){
    var items=queueItems(), t=today();
    var groups={ 'Overdue':[], 'Today':[], 'Next 7 days':[] };
    items.forEach(function(i){ groups[i.date<t?'Overdue':(i.date===t?'Today':'Next 7 days')].push(i); });
    if(!items.length){
      return '<div class="empty"><div class="display">Nothing due.</div><p>Every company and contact with a next touch date lands here when it comes due, along with open tasks and dead deals that need a decision.</p></div>';
    }
    return Object.keys(groups).map(function(g){
      if(!groups[g].length) return '';
      return '<div class="queue-group"><h3>'+g+' ('+groups[g].length+')</h3>'+groups[g].map(function(i, idx){
        var key = i.task?('task|'+i.task.id):(i.contact?('contact|'+i.contact.id):('company|'+(i.company?i.company.id:'')));
        var acts = i.task
          ? '<button class="btn btn-sm" data-q="done" data-k="'+esc(key)+'">Done</button>'
          : '<button class="btn btn-sm" data-q="snooze" data-k="'+esc(key)+'" title="Push 3 days">+3d</button>';
        return '<div class="queue-item"><div class="main"><div><span class="kind">'+esc(i.kind)+'</span>'+
          (i.company?'<span class="linkish" data-open="'+esc(i.company.id)+'">'+esc(i.title)+'</span>':esc(i.title))+'</div>'+
          '<div class="why">'+esc(i.why)+'</div></div>'+
          '<div class="when '+touchClass(i.date)+'">'+esc(fmtDate(i.date))+'</div>'+
          '<div class="acts">'+acts+(i.company?'<button class="btn btn-sm btn-primary" data-open="'+esc(i.company.id)+'" data-focuslog="1">Log</button>':'')+'</div></div>';
      }).join('')+'</div>';
    }).join('');
  }

  // ---------- companies ----------
  function filteredCompanies(){
    var f=state.filters, q=f.search.trim().toLowerCase();
    return state.companies.filter(function(co){
      if(f.owner && co.owner!==f.owner) return false;
      if(f.status && co.status!==f.status) return false;
      if(!f.status && CLOSED[co.status] && !q) return false;
      if(f.source && co.source!==f.source) return false;
      if(f.role && !contactsOf(co.id).some(function(c){ return hasRole(c,f.role); })) return false;
      if(q){
        var hay=[co.name,co.dba,co.industry,co.city,co.website].concat(contactsOf(co.id).map(function(c){ return fullName(c)+' '+c.email+' '+c.phone; })).join(' ').toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
  }
  function sortRows(rows, s, getter){
    return rows.sort(function(a,b){
      var x=getter(a,s.key), y=getter(b,s.key);
      var ex=(x==null||x===''), ey=(y==null||y==='');
      if(ex&&ey) return 0; if(ex) return 1; if(ey) return -1;
      if(typeof x==='number'&&typeof y==='number') return s.dir==='asc'?x-y:y-x;
      x=String(x).toLowerCase(); y=String(y).toLowerCase();
      return (x<y?-1:x>y?1:0)*(s.dir==='asc'?1:-1);
    });
  }
  function th(view, key, label){ var s=state.sort[view]; return '<th data-sort="'+view+'|'+key+'" class="'+(s.key===key?'sorted':'')+'">'+label+(s.key===key?(s.dir==='asc'?' ↑':' ↓'):'')+'</th>'; }
  function renderCompanies(){
    var rows=sortRows(filteredCompanies(), state.sort.companies, function(co,k){
      if(k==='contact'){ var p=primaryOf(co.id); return p?fullName(p):''; }
      if(k==='deals') return dealsOf(co.id).filter(dealOpen).length;
      if(k==='annual_revenue') return co.annual_revenue==null?null:Number(co.annual_revenue);
      return co[k];
    });
    $('countPill').textContent=rows.length+' compan'+(rows.length===1?'y':'ies');
    var hidden=state.companies.filter(function(co){ return !CLOSED[co.status]; }).length-rows.length;
    $('countPill').textContent=rows.length+' compan'+(rows.length===1?'y':'ies')+(hidden>0&&(state.filters.owner||state.filters.status||state.filters.source||state.filters.role||state.filters.search)?' · '+hidden+' hidden by filters':'');
    if(!rows.length) return '<div class="empty"><div class="display">No companies match.</div><p>Add one, import a list, or pull records from the Prospect Engine. Dead and Do Not Contact records are hidden unless you filter for them or search.</p></div>';
    return '<div class="tablewrap"><table><thead><tr>'+th('companies','name','Company')+th('companies','status','Status')+th('companies','contact','Primary contact')+
      th('companies','owner','Owner')+'<th class="hide-sm" data-sort="companies|source">Source</th>'+th('companies','annual_revenue','Revenue')+th('companies','deals','Open deals')+
      th('companies','last_touch_date','Last touch')+th('companies','next_touch_date','Next touch')+'</tr></thead><tbody>'+
      rows.map(function(co){
        var p=primaryOf(co.id), od=dealsOf(co.id).filter(dealOpen);
        var flags=(co.conflict_flag?' <span class="pill flag">Conflict</span>':'')+(co.do_not_contact?' <span class="pill flag">DNC</span>':'');
        return '<tr><td><span class="linkish" data-open="'+esc(co.id)+'">'+esc(co.name)+'</span>'+flags+(co.industry?'<div class="sub">'+esc(co.industry)+'</div>':'')+'</td>'+
          '<td>'+statusPill(co.status)+'</td>'+
          '<td>'+(p?esc(fullName(p))+'<div class="sub">'+esc(p.phone||p.email||'')+'</div>':'<span class="sub">None</span>')+'</td>'+
          '<td>'+esc(co.owner)+'</td><td class="hide-sm">'+esc(co.source)+(co.campaign_id&&campaign(co.campaign_id)?'<div class="sub">'+esc(campaign(co.campaign_id).name)+'</div>':'')+'</td>'+
          '<td>'+esc(fmtMoney(co.annual_revenue))+'</td>'+
          '<td>'+(od.length?od.map(function(d){ return '<span class="pill role">'+esc(d.pipe)+' · '+esc(d.stage)+'</span>'; }).join(' '):'')+'</td>'+
          '<td>'+esc(fmtDate(co.last_touch_date))+'</td>'+
          '<td><input type="date" class="touch-date '+touchClass(co.next_touch_date)+'" data-touch="'+esc(co.id)+'" value="'+esc(co.next_touch_date||'')+'"></td></tr>';
      }).join('')+'</tbody></table></div>';
  }

  // ---------- contacts ----------
  function renderContacts(){
    var f=state.filters, q=f.search.trim().toLowerCase();
    var rows=state.contacts.filter(function(c){
      var co=company(c.company_id);
      if(f.owner && (c.owner||(co&&co.owner))!==f.owner) return false;
      if(f.status && (co?co.status:c.status)!==f.status) return false;
      if(f.source && (c.source||(co&&co.source))!==f.source) return false;
      if(f.role && !hasRole(c,f.role)) return false;
      if(q && (fullName(c)+' '+c.email+' '+c.phone+' '+c.title+' '+(co?co.name:'')).toLowerCase().indexOf(q)<0) return false;
      return true;
    });
    rows=sortRows(rows, state.sort.contacts, function(c,k){ if(k==='name') return fullName(c); if(k==='company'){ var co=company(c.company_id); return co?co.name:''; } return c[k]; });
    $('countPill').textContent=rows.length+' contact'+(rows.length===1?'':'s');
    if(!rows.length) return '<div class="empty"><div class="display">No contacts match.</div><p>Contacts live under a company. Open a company to add people, or filter by role to see your COIs.</p></div>';
    return '<div class="tablewrap"><table><thead><tr>'+th('contacts','name','Name')+th('contacts','company','Company')+'<th>Roles</th>'+th('contacts','email','Email')+th('contacts','phone','Phone')+
      th('contacts','last_touch_date','Last touch')+th('contacts','next_touch_date','Next touch')+'<th>COI</th></tr></thead><tbody>'+
      rows.map(function(c){
        var co=company(c.company_id);
        return '<tr><td>'+(co?'<span class="linkish" data-open="'+esc(co.id)+'">'+esc(fullName(c)||'(no name)')+'</span>':'<span class="linkish" data-opencontact="'+esc(c.id)+'">'+esc(fullName(c)||'(no name)')+'</span>')+(c.title?'<div class="sub">'+esc(c.title)+'</div>':'')+(c.do_not_contact||c.email_opt_out?' <span class="pill flag">'+(c.do_not_contact?'DNC':'Opted out')+'</span>':'')+'</td>'+
          '<td>'+(co?esc(co.name):'<span class="sub">Individual</span>')+'</td>'+
          '<td>'+(c.roles||[]).map(function(r){ return '<span class="pill role">'+esc(r)+'</span>'; }).join(' ')+'</td>'+
          '<td>'+(c.email?'<a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>':'')+'</td>'+
          '<td>'+(c.phone?'<a href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a>':'')+'</td>'+
          '<td>'+esc(fmtDate(c.last_touch_date))+'</td>'+
          '<td><input type="date" class="touch-date '+touchClass(c.next_touch_date)+'" data-ctouch="'+esc(c.id)+'" value="'+esc(c.next_touch_date||'')+'"></td>'+
          '<td>'+(c.referral_partner_id?'<a class="btn btn-sm" href="'+TOOL+'cobalt-referral-partners/" target="_blank" rel="noopener">In tracker</a>':(isReferralSource(c)?'<button class="btn btn-sm" data-makecoi="'+esc(c.id)+'">Make COI</button>':''))+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }

  // ---------- sources & campaigns: what actually produces ----------
  function attribution(){
    var bySource={}, byCampaign={};
    function bucket(map,k){ if(!map[k]) map[k]={ companies:0, qualified:0, deals:0, funded:0, commission:0 }; return map[k]; }
    state.companies.forEach(function(co){
      var ds=dealsOf(co.id), funded=ds.filter(function(d){ return d.stage==='Funded'||d.stage==='SLB Closed'; });
      var comm=funded.reduce(function(s,d){ return s+(Number(d.actual_commission)||0); },0);
      [bucket(bySource, co.source||'Unknown')].concat(co.campaign_id?[bucket(byCampaign, co.campaign_id)]:[]).forEach(function(b){
        b.companies++; if(['Qualified','Client'].indexOf(co.status)>=0||ds.length) b.qualified++;
        b.deals+=ds.length; b.funded+=funded.length; b.commission+=comm;
      });
    });
    return { bySource:bySource, byCampaign:byCampaign };
  }
  function coiProduction(){
    var out={};
    state.companies.forEach(function(co){
      if(!co.referred_by_contact_id) return;
      var k=co.referred_by_contact_id; if(!out[k]) out[k]={ companies:0, deals:0, funded:0 };
      var ds=dealsOf(co.id); out[k].companies++; out[k].deals+=ds.length; out[k].funded+=ds.filter(function(d){ return d.stage==='Funded'; }).length;
    });
    return out;
  }
  function renderCampaigns(){
    var a=attribution(), coi=coiProduction();
    $('countPill').textContent='';
    var srcRows=Object.keys(a.bySource).sort(function(x,y){ return a.bySource[y].companies-a.bySource[x].companies; });
    var h='<div class="section-title" style="margin-top:0">By source</div><div class="tablewrap"><table><thead><tr><th>Source</th><th>Companies</th><th>Qualified</th><th>Deals opened</th><th>Funded</th><th>Funded commission</th></tr></thead><tbody>'+
      (srcRows.length?srcRows.map(function(k){ var b=a.bySource[k]; return '<tr><td><b>'+esc(k)+'</b></td><td>'+b.companies+'</td><td>'+b.qualified+'</td><td>'+b.deals+'</td><td>'+b.funded+'</td><td>'+esc(fmtMoney(b.commission)||'$0')+'</td></tr>'; }).join(''):'<tr><td colspan="6" class="sub">No companies yet.</td></tr>')+'</tbody></table></div>';
    h+='<div class="section-title">Campaigns <button class="btn btn-sm btn-primary" id="addCampaignBtn">+ Campaign</button></div><div class="tablewrap"><table><thead><tr><th>Campaign</th><th>Channel</th><th>Started</th><th>Cost</th><th>Companies</th><th>Deals</th><th>Funded</th><th>Commission</th><th>Cost per deal</th><th></th></tr></thead><tbody>'+

  // ---------- summary ----------
  function renderSummary(){

    var q=queueItems();
    var overdue=q.filter(function(i){ return i.date<t; }).length, dueToday=q.filter(function(i){ return i.date===t; }).length;
    var touches=state.activities.filter(function(a){ return a.completed && a.type!=='System' && a.type!=='Task' && a.created_at>=wkAgo && (!own||a.owner===own); }).length;
    var cois=state.contacts.filter(function(c){ return hasRole(c,'COI'); }).length;
    var nurture=live.filter(function(c){ return c.status==='Nurture'; }).length;
    var noTouch=live.filter(function(c){ return !c.next_touch_date && ['Prospect','Working','Qualified','Nurture'].indexOf(c.status)>=0; }).length;
    $('summary').innerHTML=[
      [live.length,'Active companies',''],[overdue,'Overdue',overdue?'bad':''],[dueToday,'Due today',dueToday?'warn':''],
      [touches,'Touches · 7 days','accent'],[noTouch,'No next touch',noTouch?'warn':''],[cois+' / '+nurture,'COIs / Nurture','']
    ].map(function(c){ return '<div class="cell"><div class="num '+c[2]+'">'+c[0]+'</div><div class="lbl">'+c[1]+'</div></div>'; }).join('');
    $('ct-today').textContent=q.filter(function(i){ return i.date<=t; }).length;
    $('ct-companies').textContent=state.companies.filter(function(c){ return !CLOSED[c.status]; }).length;
    $('ct-contacts').textContent=state.contacts.length;

  // ---------- duplicate detection ----------
  function findDuplicates(name, email, phone){
    var n=normName(name), e=normEmail(email), p=normPhone(phone), out=[];
    state.companies.forEach(function(co){ if(n && n.length>2 && normName(co.name)===n) out.push({ co:co, why:'Same company name' }); });
    state.contacts.forEach(function(c){
      var why = (e && normEmail(c.email)===e)?'Same email':((p && normPhone(c.phone)===p)?'Same phone':'');
      if(why){ var co=company(c.company_id); if(co && !out.some(function(o){ return o.co.id===co.id; })) out.push({ co:co, why:why+' ('+fullName(c)+')' }); }
    });
    return out;
  }

  async function saveCompanyField(id, field, el){
    var co=company(id); if(!co) return;
    var v;
    if(el.type==='checkbox') v=el.checked;
    else if(el.getAttribute('data-money')) v=parseMoney(el.value);
    else if(field==='employees') v=el.value===''?null:Number(el.value);
    else if(['campaign_id','referred_by_contact_id','next_touch_date'].indexOf(field)>=0) v=el.value||null;
    else v=el.value.trim();
    if(field==='status' && v==='Nurture' && co.status!=='Nurture'){ el.value=co.status; openNurture(id); return; }
    var fields={}; fields[field]=v;
    if(field==='name') fields.dedupe_key=normName(v);
    if(field==='status' && v==='Do Not Contact') fields.do_not_contact=true;
    var old=co[field];
    Object.assign(co, fields);
    try{
      await patch('crm_companies', id, fields);
      if(field==='status' && old!==v) await logSystem(id, 'Status '+(old||'none')+' → '+v);
      toast('Saved');
      if(['status','do_not_contact','conflict_flag','referred_by_contact_id'].indexOf(field)>=0){ await refresh(); openCompany(id); } else render();
    }catch(e){ co[field]=old; toast('Save failed: '+e.message); }
  }
  async function logSystem(companyId, body){

  async function saveLog(id){
    var co=company(id), t=state.logType, body=val('lgBody'), next=val('lgNext'), cid=val('lgContact')||null;
    if(blocked(co)){ toast('This record is flagged. Clear the flag first.'); return; }
    if(!body && (t==='Task'||t==='Note')){ toast(t==='Task'?'Describe the task':'Write the note'); return; }
    var now=new Date().toISOString(), td=today();
    $('lgSave').disabled=true;
    try{
      if(t==='Task'){
        await insert('crm_activities',[{ id:uid('act'), company_id:id, contact_id:cid, type:'Task', subject:body, due_date:next||td, completed:false, owner:co.owner||me(), created_by:who() }]);
        toast('Task added');
      } else {
        await insert('crm_activities',[{ id:uid('act'), company_id:id, contact_id:cid, type:t, outcome:val('lgOutcome'), body:body, completed:true, completed_at:now, owner:me()||co.owner, created_by:who() }]);
        var f={ last_touch_date:td, next_touch_date:next||null };
        if(co.status==='Prospect' && t!=='Note') f.status='Working';
        await patch('crm_companies', id, f);
        if(cid) await patch('crm_contacts', cid, { last_touch_date:td });
        if(val('lgOutcome')==='Not interested' && confirm('Marked not interested. Move this company to Nurture now?')){ await refresh(); openNurture(id); return; }

  }

  function openProspectPull(){

      var q=this.value.trim(); clearTimeout(h); if(q.length<2){ $('ppResults').innerHTML=''; return; }
      h=setTimeout(async function(){
        try{
          var term=encodeURIComponent('*'+q.replace(/[(),*]/g,' ')+'*');
          var rows=await get('/prospects?or=(owner_name.ilike.'+term+',situs_address.ilike.'+term+')&select=id,owner_name,situs_address,mailing_address,email,phone,property_value,status,crm_company_id,assigned_to&limit=20');
          $('ppResults').innerHTML=(rows||[]).length?rows.map(function(p){
            return '<div class="card"><div class="row"><div><b>'+esc(p.owner_name)+'</b><div class="meta">'+esc([p.situs_address, fmtMoney(p.property_value), p.status].filter(Boolean).join(' · '))+'</div></div>'+
              (p.crm_company_id?'<button class="btn btn-sm" data-open="'+esc(p.crm_company_id)+'">In CRM</button>':'<button class="btn btn-sm btn-primary" data-pull="'+esc(p.id)+'">Add to CRM</button>')+'</div></div>';

  async function pullProspect(pid){
    var rows=$('ppResults')._rows||[], p=rows.filter(function(r){ return r.id===pid; })[0]; if(!p) return;
    var parts=(p.owner_name||'').split(','), person=parts.length>1?parts[0].trim():'', firm=parts.length>1?parts.slice(1).join(',').trim():(p.owner_name||'').trim();
    var dups=findDuplicates(firm, p.email, p.phone);
    if(dups.length && confirm(firm+' looks like '+dups[0].co.name+' ('+dups[0].why+'). Link the prospect to that existing record? Cancel creates a new company instead.')){
      try{ await patch('prospects', pid, { crm_company_id:dups[0].co.id }); await patch('crm_companies', dups[0].co.id, { linked_prospect_id:pid }); await refresh(); toast('Linked to existing record'); openCompany(dups[0].co.id); }catch(e){ toast('Link failed: '+e.message); }
      return;
    }
    var co={ id:uid('co'), name:firm||person, address:p.situs_address||p.mailing_address||'', status:'Working', owner:p.assigned_to||me(), source:'Prospect engine', linked_prospect_id:pid, next_touch_date:addDays(1), dedupe_key:normName(firm||person), created_by:who() };
    var np=person.split(' ');
    var ct=(person||p.email||p.phone)?{ id:uid('ct'), company_id:co.id, first_name:np[0]||'', last_name:np.slice(1).join(' '), email:p.email||'', phone:p.phone||'', roles:['Owner'], is_primary:true, status:'Working', owner:co.owner, source:co.source, dedupe_key:normEmail(p.email)||null, created_by:who() }:null;
    try{
      await insert('crm_companies',[co]); if(ct) await insert('crm_contacts',[ct]);
      await patch('prospects', pid, { crm_company_id:co.id });
      await logSystem(co.id, 'Pulled from CRE Cold Outreach');
      await refresh(); toast('Added to CRM'); openCompany(co.id);
    }catch(e){ toast('Could not add: '+e.message); }
  }

  // ---------- CSV import with dedupe ----------
  var IMPORT_FIELDS=[['company','Company'],['first','First name'],['last','Last name'],['full','Full name'],['title','Title'],['email','Email'],['phone','Phone'],['industry','Industry'],['revenue','Revenue'],['website','Website'],['address','Address'],['city','City'],['state','State'],['zip','Zip'],['notes','Notes']];
  var GUESS={ company:/^(company|business|organization|org|account|firm|recipient|vendor|legal name)/i, first:/^first/i, last:/^last/i, full:/^(full )?name$|^contact( name)?$/i, title:/title|position/i, email:/e-?mail/i, phone:/phone|tel|mobile/i, industry:/industry|naics|sector/i, revenue:/revenue|sales/i, website:/web|url|domain/i, address:/address|street/i, city:/^city/i, state:/^state|^st$/i, zip:/zip|postal/i, notes:/note|comment|description/i };
  function openImport(rows, headers){
    var map={}; IMPORT_FIELDS.forEach(function(f){ for(var i=0;i<headers.length;i++){ if(GUESS[f[0]].test(headers[i]) && Object.keys(map).map(function(k){ return map[k]; }).indexOf(headers[i])<0){ map[f[0]]=headers[i]; break; } } });
    showModal('<div class="modal-head"><div><h2 class="display">Import '+rows.length+' rows</h2><p>Map the columns, tag the source, and duplicates get skipped automatically.</p></div><button class="x" data-close>×</button></div><div class="modal-body"><div class="grid3">'+
      IMPORT_FIELDS.map(function(f){ return '<div class="fb"><label>'+f[1]+'</label><select data-map="'+f[0]+'">'+opts(headers, map[f[0]]||'', 'Skip')+'</select></div>'; }).join('')+'</div>'+
      '<div class="section-title">Tag every row</div><div class="grid3"><div class="fb"><label>Source</label><select id="imSource">'+opts(SOURCES,'','Choose')+'</select></div><div class="fb"><label>Campaign</label><select id="imCampaign">'+campaignOpts('')+'</select></div>'+
      '<div class="fb"><label>Owner</label><select id="imOwner">'+opts(OWNERS, me(), 'Unassigned')+'</select></div><div class="fb"><label>Status</label><select id="imStatus">'+opts(STATUSES,'Prospect')+'</select></div>'+
      '<div class="fb"><label>Roles for contacts</label><select id="imRole">'+opts(ROLES,'Owner')+'</select></div><div class="fb"><label>First touch</label><input type="date" id="imNext" value=""></div></div>'+
      '<div id="imPreview" style="margin-top:14px"></div></div>'+
      '<div class="modal-foot"><button class="btn" id="imCheck">Check duplicates</button><button class="btn btn-primary" id="imGo" disabled>Import</button></div>');
    var plan=null;
    function build(){
      var m={}; Array.prototype.forEach.call(document.querySelectorAll('[data-map]'), function(s){ if(s.value) m[s.getAttribute('data-map')]=s.value; });
      var seenCo={}, seenEmail={}, out={ create:[], dup:[], skip:0 };
      rows.forEach(function(r){
        var g=function(k){ return m[k]?String(r[m[k]]==null?'':r[m[k]]).trim():''; };
        var first=g('first'), last=g('last'); if(!first && !last && g('full')){ var p=g('full').split(/\s+/); first=p[0]; last=p.slice(1).join(' '); }
        var name=g('company')||((first+' '+last).trim()); if(!name){ out.skip++; return; }
        var email=g('email'), phone=g('phone');
        var d=findDuplicates(name, email, phone);
        var ek=normEmail(email), nk=normName(name);
        if(d.length){ out.dup.push({ name:name, why:d[0].why+' · '+d[0].co.name }); return; }
        if((ek && seenEmail[ek]) || (nk && seenCo[nk] && !ek)){ out.dup.push({ name:name, why:'Repeated in this file' }); return; }
        if(ek) seenEmail[ek]=1; if(nk) seenCo[nk]=1;
        out.create.push({ name:name, first:first, last:last, title:g('title'), email:email, phone:phone, industry:g('industry'), revenue:parseMoney(g('revenue')), website:g('website'), address:g('address'), city:g('city'), state:g('state'), zip:g('zip'), notes:g('notes'), hasPerson:!!(first||last||email||phone) });
      });
      return out;
    }
    $('imCheck').addEventListener('click', function(){
      plan=build();
      $('imPreview').innerHTML='<div class="banner '+(plan.dup.length?'amber':'')+'" style="background:'+(plan.dup.length?'':'var(--green-tint)')+';color:'+(plan.dup.length?'':'var(--green)')+'"><b>'+plan.create.length+' new</b> · '+plan.dup.length+' duplicates skipped · '+plan.skip+' blank rows skipped</div>'+
        (plan.dup.length?'<div class="sub" style="max-height:120px;overflow:auto">'+plan.dup.slice(0,50).map(function(d){ return esc(d.name)+' ('+esc(d.why)+')'; }).join('<br>')+'</div>':'');
      $('imGo').disabled=!plan.create.length;
    });
    $('imGo').addEventListener('click', async function(){
      if(!plan) return; this.disabled=true; $('imCheck').disabled=true;
      var src=val('imSource'), camp=val('imCampaign')||null, owner=val('imOwner'), status=val('imStatus')||'Prospect', role=val('imRole'), next=val('imNext')||null;
      var cos=[], cts=[], acts=[];
      plan.create.forEach(function(r){
        var co={ id:uid('co'), name:r.name, industry:r.industry, annual_revenue:r.revenue, website:r.website, address:r.address, city:r.city, state:r.state, zip:r.zip, status:status, owner:owner, source:src, campaign_id:camp, next_touch_date:next, dedupe_key:normName(r.name), created_by:who() };
        cos.push(co);
        if(r.hasPerson) cts.push({ id:uid('ct'), company_id:co.id, first_name:r.first, last_name:r.last, title:r.title, email:r.email, phone:r.phone, roles:role?[role]:[], is_primary:true, status:status, owner:owner, source:src, campaign_id:camp, dedupe_key:normEmail(r.email)||null, created_by:who() });
        acts.push({ id:uid('act'), company_id:co.id, type:'System', body:'Imported'+(camp&&campaign(camp)?' · '+campaign(camp).name:'')+(r.notes?'\n'+r.notes:''), owner:owner, created_by:who() });
      });
      try{
        for(var i=0;i<cos.length;i+=200){ await insert('crm_companies', cos.slice(i,i+200)); $('imPreview').innerHTML='<div class="sub">Saving companies '+Math.min(i+200,cos.length)+' of '+cos.length+'…</div>'; }
        for(var j=0;j<cts.length;j+=200) await insert('crm_contacts', cts.slice(j,j+200));
        for(var k=0;k<acts.length;k+=200) await insert('crm_activities', acts.slice(k,k+200));
        closeModal(); await refresh(); toast('Imported '+cos.length+' companies'); state.view='companies'; render();
      }catch(e){ toast('Import stopped: '+e.message); this.disabled=false; }
    });
  }

  // ---------- export ----------
  function exportCsv(){
    var rows=filteredCompanies().map(function(co){ var p=primaryOf(co.id), cmp=co.campaign_id?campaign(co.campaign_id):null;
      return { Company:co.name, Status:co.status, Owner:co.owner, Source:co.source, Campaign:cmp?cmp.name:'', Industry:co.industry, Revenue:co.annual_revenue||'', City:co.city, State:co.state, Website:co.website,
        Contact:p?fullName(p):'', Title:p?p.title:'', Email:p?p.email:'', Phone:p?p.phone:'', 'Last touch':co.last_touch_date||'', 'Next touch':co.next_touch_date||'', 'Open deals':dealsOf(co.id).filter(dealOpen).length }; });
    var csv=window.Papa?Papa.unparse(rows):JSON.stringify(rows);
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='cobalt-crm-'+today()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------- events ----------
  async function refresh(){ try{ await loadAll(); render(); }catch(e){ toast('Load failed: '+e.message); } }

  document.addEventListener('click', function(e){
    var t=e.target.closest('[data-open],[data-close],[data-sort],[data-q],[data-makecoi],[data-addcontact],[data-editcontact],[data-opendeal],[data-nurture],[data-delco],[data-taskdone],[data-ltype],[data-qd],[data-editcamp],[data-pull],[data-opencontact],#addCampaignBtn');
    if(!t) return;
    if(t.hasAttribute('data-close')){ closeModal(); return; }
    if(t.hasAttribute('data-open')){ openCompany(t.getAttribute('data-open'), { focusLog:t.hasAttribute('data-focuslog') }); return; }
    if(t.hasAttribute('data-opencontact')){ openContactForm(null, t.getAttribute('data-opencontact')); return; }
    if(t.hasAttribute('data-sort')){ var p=t.getAttribute('data-sort').split('|'), s=state.sort[p[0]]; if(s.key===p[1]) s.dir=s.dir==='asc'?'desc':'asc'; else { s.key=p[1]; s.dir='asc'; } render(); return; }
    if(t.hasAttribute('data-q')){ queueAction(t.getAttribute('data-q'), t.getAttribute('data-k')); return; }
    if(t.hasAttribute('data-makecoi')){ makeCOI(t.getAttribute('data-makecoi')); return; }
    if(t.hasAttribute('data-addcontact')){ openContactForm(t.getAttribute('data-addcontact')); return; }
    if(t.hasAttribute('data-editcontact')){ openContactForm(null, t.getAttribute('data-editcontact')); return; }
    if(t.hasAttribute('data-opendeal')){ openDealForm(t.getAttribute('data-opendeal')); return; }
    if(t.hasAttribute('data-nurture')){ openNurture(t.getAttribute('data-nurture')); return; }
    if(t.hasAttribute('data-delco')){ deleteCompany(t.getAttribute('data-delco')); return; }
    if(t.hasAttribute('data-taskdone')){ completeTask(t.getAttribute('data-taskdone')); return; }
    if(t.hasAttribute('data-ltype')){ state.logType=t.getAttribute('data-ltype'); Array.prototype.forEach.call(document.querySelectorAll('.typebtn'), function(b){ b.classList.toggle('on', b===t); }); syncLogType(); return; }
    if(t.hasAttribute('data-qd')){ $('lgNext').value=addDays(Number(t.getAttribute('data-qd'))); return; }
    if(t.hasAttribute('data-editcamp')){ openCampaign(t.getAttribute('data-editcamp')); return; }
    if(t.id==='addCampaignBtn'){ openCampaign(null); return; }
    if(t.hasAttribute('data-pull')){ pullProspect(t.getAttribute('data-pull')); return; }
  });
  document.addEventListener('change', function(e){
    var t=e.target;
    if(t.hasAttribute('data-touch')){ var co=company(t.getAttribute('data-touch')); if(!co) return; co.next_touch_date=t.value||null; patch('crm_companies', co.id, { next_touch_date:co.next_touch_date }).then(function(){ toast('Next touch set'); render(); }).catch(function(err){ toast('Save failed: '+err.message); }); return; }
    if(t.hasAttribute('data-ctouch')){ var c=contact(t.getAttribute('data-ctouch')); if(!c) return; c.next_touch_date=t.value||null; patch('crm_contacts', c.id, { next_touch_date:c.next_touch_date }).then(function(){ toast('Next touch set'); render(); }).catch(function(err){ toast('Save failed: '+err.message); }); return; }
    if(t.hasAttribute('data-f') && state.openId){ saveCompanyField(state.openId, t.getAttribute('data-f'), t); return; }
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && $('overlay').style.display!=='none') closeModal(); });
  $('overlay').addEventListener('mousedown', function(e){ if(e.target.id==='overlay') closeModal(); });
  document.addEventListener('click', function(e){ if(e.target && e.target.id==='lgSave' && state.openId) saveLog(state.openId); });

  async function queueAction(act, key){
    var p=key.split('|'), kind=p[0], id=p.slice(1).join('|');
    try{
      if(act==='done' && kind==='task'){ await completeTask(id, true); return; }
      if(act==='snooze'){ var d=addDays(3); if(kind==='company') await patch('crm_companies', id, { next_touch_date:d }); else if(kind==='contact') await patch('crm_contacts', id, { next_touch_date:d }); toast('Pushed to '+fmtDate(d)); await refresh(); }
    }catch(e){ toast('Failed: '+e.message); }
  }
  async function completeTask(id, fromQueue){
    var a=state.activities.filter(function(x){ return x.id===id; })[0]; if(!a) return;
    try{
      await patch('crm_activities', id, { completed:true, completed_at:new Date().toISOString() });
      if(a.company_id) await patch('crm_companies', a.company_id, { last_touch_date:today() });
      await refresh(); toast('Task done'); if(!fromQueue && state.openId) openCompany(state.openId);
    }catch(e){ toast('Failed: '+e.message); }
  }
  async function deleteCompany(id){
    var co=company(id); if(!co) return;
    var deals=dealsOf(id);
    if(deals.length){ toast('This company has '+deals.length+' linked deal(s). Move it to Dead or Nurture instead of deleting.'); return; }
    if(!confirm('Permanently delete '+co.name+', its contacts, and its activity history? Consider Dead or Do Not Contact instead, which keeps the record.')) return;
    try{
      var cts=contactsOf(id);
      for(var i=0;i<cts.length;i++){ if(cts[i].referral_partner_id){ toast(fullName(cts[i])+' is a COI in the tracker. Detach or keep the company.'); return; } }
      for(var j=0;j<cts.length;j++) await del('crm_contacts', cts[j].id);
      await del('crm_companies', id); closeModal(); await refresh(); toast('Deleted');
    }catch(e){ toast('Delete failed: '+e.message); }
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ b.addEventListener('click', function(){ state.view=b.getAttribute('data-view'); state.filters.owner=state.ownerByView[state.view]||''; $('countPill').textContent=''; render(); }); });
  ['fOwner','fStatus','fSource','fRole'].forEach(function(id){ $(id).addEventListener('change', function(){ var k={fOwner:'owner',fStatus:'status',fSource:'source',fRole:'role'}[id]; state.filters[k]=this.value; if(k==='owner') state.ownerByView[state.view]=this.value; render(); }); });
  var sh; $('fSearch').addEventListener('input', function(){ var v=this.value; clearTimeout(sh); sh=setTimeout(function(){ state.filters.search=v; render(); }, 150); });
  $('refreshBtn').addEventListener('click', function(){ refresh().then(function(){ toast('Refreshed'); }); });
  $('addCompanyBtn').addEventListener('click', function(){ openAddCompany(); });
  $('pullProspectBtn').addEventListener('click', openProspectPull);
  $('exportBtn').addEventListener('click', exportCsv);
  $('importBtn').addEventListener('click', function(){ $('csvInput').value=''; $('csvInput').click(); });
  $('csvInput').addEventListener('change', function(e){
    var f=e.target.files[0]; if(!f) return;
    if(!window.Papa){ toast('CSV library did not load. Check your connection.'); return; }
    Papa.parse(f, { header:true, skipEmptyLines:true, complete:function(res){ var rows=res.data||[]; if(!rows.length){ toast('No rows found'); return; } openImport(rows, res.meta.fields||Object.keys(rows[0])); } });
  });
  $('toolSwitcher').addEventListener('change', function(){ if(this.value) window.location.href=this.value; });
  $('signOutBtn').addEventListener('click', function(){ clearSession(); showAuth(); });

  // ---------- boot ----------
  function showAuth(){ $('authGate').style.display='flex'; $('mainApp').style.display='none'; }
  async function showApp(){
    $('authGate').style.display='none'; $('mainApp').style.display='block';
    // Today defaults to your own queue; Companies, Contacts and Sources default to the whole book.
    state.ownerByView.today = me();
    state.filters.owner = state.ownerByView[state.view] || '';
    await refresh();
    var cid=new URLSearchParams(location.search).get('company');
    if(cid && company(cid)) openCompany(cid);
  }
  $('authSubmit').addEventListener('click', async function(){
    var em=val('authEmail'), pw=$('authPassword').value; $('authErr').classList.remove('show');
    if(!em||!pw){ $('authErr').textContent='Enter email and password'; $('authErr').classList.add('show'); return; }
    this.disabled=true;
    try{ saveSession(await authCall('password', { email:em, password:pw })); await showApp(); }
    catch(e){ $('authErr').textContent=e.message; $('authErr').classList.add('show'); }
    this.disabled=false;
  });
  $('authPassword').addEventListener('keydown', function(e){ if(e.key==='Enter') $('authSubmit').click(); });

  (async function(){ loadSession(); if(await ensureSession()) showApp(); else showAuth(); })();

  window.__crm = { state:state, queueItems:queueItems, findDuplicates:findDuplicates, parseMoney:parseMoney, normName:normName, openImport:openImport, openCompany:openCompany };
})();
</script>
</body>
</html>
